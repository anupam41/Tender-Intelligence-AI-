plugins { id 'com.android.application' }
android {
 namespace 'com.tenderintelligence.ai'
 compileSdk 35
 defaultConfig { applicationId 'com.tenderintelligence.ai'; minSdk 26; targetSdk 35; versionCode 1; versionName '0.1.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }

 // Release signing is enabled only in CI after the signing secrets are configured.
 def signingFile = System.getenv('TENDER_SIGNING_STORE_FILE')
 def signingPassword = System.getenv('TENDER_SIGNING_STORE_PASSWORD')
 def signingAlias = System.getenv('TENDER_SIGNING_KEY_ALIAS')
 def signingKeyPassword = System.getenv('TENDER_SIGNING_KEY_PASSWORD')
 if (signingFile && signingPassword && signingAlias && signingKeyPassword) {
  signingConfigs {
   release {
    storeFile file(signingFile)
    storePassword signingPassword
    keyAlias signingAlias
    keyPassword signingKeyPassword
   }
  }
  buildTypes { release { signingConfig signingConfigs.release } }
 }
}

dependencies { implementation 'com.tom-roush:pdfbox-android:2.0.27.0'; implementation 'androidx.core:core:1.15.0' }
