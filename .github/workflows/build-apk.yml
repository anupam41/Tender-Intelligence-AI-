name: Build Android APK
on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: 'Also build a signed release APK (requires valid signing secrets)'
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install required Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TenderIntelligence-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare release signing
        # Explicit release requests only; ordinary pushes remain debug-only.
        if: (github.event_name == 'workflow_dispatch' && inputs.signed_release == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[signed release]'))
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.TENDER_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TENDER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TENDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TENDER_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/tender-release.jks"
            chmod 600 "$RUNNER_TEMP/tender-release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::error::Signed release requested, but one or more TENDER_* signing secrets are missing. Debug APK is still available."
            exit 1
          fi
      - name: Validate release signing credentials
        if: steps.signing.outputs.enabled == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.TENDER_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TENDER_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TENDER_KEY_PASSWORD }}
        run: |
          if ! keytool -list -keystore "$RUNNER_TEMP/tender-release.jks" -storepass "$STORE_PASSWORD" >/dev/null 2>&1; then
            echo "::error::Cannot open the keystore. Check TENDER_KEYSTORE_BASE64 and TENDER_STORE_PASSWORD."
            exit 1
          fi
          if ! keytool -list -keystore "$RUNNER_TEMP/tender-release.jks" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Key alias not found. Check TENDER_KEY_ALIAS."
            exit 1
          fi
          if ! keytool -certreq -alias "$KEY_ALIAS" -keystore "$RUNNER_TEMP/tender-release.jks" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" -file "$RUNNER_TEMP/tender-signing-test.csr" >/dev/null 2>&1; then
            echo "::error::Cannot unlock the signing key. Check TENDER_KEY_PASSWORD and alias."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/tender-signing-test.csr"
      - name: Build signed release APK
        if: steps.signing.outputs.enabled == 'true'
        env:
          TENDER_SIGNING_STORE_FILE: ${{ runner.temp }}/tender-release.jks
          TENDER_SIGNING_STORE_PASSWORD: ${{ secrets.TENDER_STORE_PASSWORD }}
          TENDER_SIGNING_KEY_ALIAS: ${{ secrets.TENDER_KEY_ALIAS }}
          TENDER_SIGNING_KEY_PASSWORD: ${{ secrets.TENDER_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify release APK signature
        if: steps.signing.outputs.enabled == 'true' && success()
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk'
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.enabled == 'true' && success()
        with:
          name: TenderRadar-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/tender-release.jks"
