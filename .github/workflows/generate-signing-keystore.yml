name: Generate Tender Radar Signing Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate and encrypt signing key
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.TENDER_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.TENDER_KEY_PASSWORD }}
          BACKUP_PASSPHRASE: ${{ secrets.TENDER_BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$BACKUP_PASSPHRASE" ]]; then
            echo "::error::Set TENDER_STORE_PASSWORD, TENDER_KEY_PASSWORD and TENDER_BACKUP_PASSPHRASE in Actions secrets first."
            exit 1
          fi
          if [[ "${#STORE_PASSWORD}" -lt 12 || "${#KEY_PASSWORD}" -lt 12 || "${#BACKUP_PASSPHRASE}" -lt 20 ]]; then
            echo "::error::Use at least 12 characters for signing passwords and 20 for backup passphrase."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tender-signing"
          keytool -genkeypair -noprompt \
            -keystore "$RUNNER_TEMP/tender-signing/tender-release.jks" \
            -storetype PKCS12 \
            -alias tender \
            -keyalg RSA -keysize 3072 -sigalg SHA256withRSA \
            -validity 10000 \
            -dname "CN=Tender Radar, OU=Android, O=Tender Radar, C=IN" \
            -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD"
          keytool -list -keystore "$RUNNER_TEMP/tender-signing/tender-release.jks" -storepass "$STORE_PASSWORD" -alias tender >/dev/null
          openssl enc -aes-256-cbc -pbkdf2 -iter 250000 -salt \
            -in "$RUNNER_TEMP/tender-signing/tender-release.jks" \
            -out "$RUNNER_TEMP/tender-signing/tender-release.jks.enc" \
            -pass env:BACKUP_PASSPHRASE
          rm -f "$RUNNER_TEMP/tender-signing/tender-release.jks"
          echo "Encrypted keystore backup prepared. Download artifact and decrypt locally."

      - name: Upload encrypted keystore backup
        uses: actions/upload-artifact@v4
        with:
          name: TenderRadar-encrypted-keystore-backup
          path: ${{ runner.temp }}/tender-signing/tender-release.jks.enc
          retention-days: 1
          if-no-files-found: error

      - name: Remove temporary files
        if: always()
        run: rm -rf "$RUNNER_TEMP/tender-signing"
